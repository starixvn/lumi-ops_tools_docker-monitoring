---
global:
  evaluation_interval: 15s
  external_labels:
    monitor: l1
  scrape_interval: 15s
rule_files:
  - alert.rules
scrape_configs:
  - job_name: prometheus
    scrape_interval: 120s
    static_configs:
      - targets:
          - 'localhost:9090'
          - 'cadvisor:8080'
          - 'node-exporter:9100'
          - 'nginx-exporter:9113'
